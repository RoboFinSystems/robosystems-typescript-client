version: 2

updates:
  # npm — package.json and package-lock.json dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
    # Routine minor/patch churn arrives as two PRs instead of a dozen.
    # Majors are deliberately left ungrouped: they need individual triage,
    # and grouping them would force an all-or-nothing call on unrelated bumps.
    # That matters more here than in the apps — the `dependencies` block is
    # this package's public surface, so a major there lands on consumers.
    # vite-toolchain is the exception and is listed first (a dependency joins
    # the first group it matches): those packages are peer-locked to each
    # other, so they are already one decision.
    groups:
      # Only vitest matches today, but vite and @vitest/* are peer-locked to
      # it (vitest peers vite; @vitest/coverage-v8 peers vitest at an exact
      # version), so the group is here before it is needed rather than after
      # a split major deadlocks two PRs against each other.
      vite-toolchain:
        patterns:
          - 'vite'
          - 'vitest'
          - '@vitejs/*'
          - '@vitest/*'
      # The codegen toolchain moves as a unit: cli, typescript,
      # typescript-operations and typed-document-node are released together and
      # are only tested against matching majors. Dependabot proposed three of
      # the four on 2026-09-01 and silently omitted @graphql-codegen/typescript,
      # which would have left cli v7 driving typescript v5 — a combination
      # nobody upstream tests. No update-types filter, so majors travel
      # together.
      graphql-codegen:
        patterns:
          - '@graphql-codegen/*'
      # graphql and the packages that peer on it. graphql-request pins
      # graphql "14 - 16", so a graphql major can only ever land alongside a
      # graphql-request that accepts it. Grouping them means that day arrives
      # as one resolvable PR instead of two that block each other. See the
      # graphql ignore entry below for why nothing moves here yet.
      graphql-core:
        patterns:
          - 'graphql'
          - 'graphql-request'
          - '@graphql-typed-document-node/*'
      npm-production:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      npm-development:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Blocked upstream, not by us: graphql-request (7.4.0, latest) peers
      # graphql "14 - 16", and graphql-request is a production dependency here,
      # so graphql 17 fails `npm install` with ERESOLVE and can never go green.
      # Dependabot proposed it as #214 on 2026-09-01 and CI failed on exactly
      # that. Drop this entry once graphql-request ships a release that accepts
      # graphql 17 — the graphql-core group above will then carry both in one
      # PR.
      - dependency-name: 'graphql'
        update-types:
          - 'version-update:semver-major'
      # Blocked upstream: typescript-eslint v8 peers typescript
      # ">=4.8.4 <6.1.0". TypeScript 7 is also the native Go port, so it is a
      # migration to schedule rather than a bump to take. Drop this entry once
      # typescript-eslint v9 supports the 7.x line.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      # @types/node tracks the runtime floor, not npm's cadence. This package
      # declares engines >=22.0.0, and as a published library it has to keep
      # compiling for the *oldest* Node it claims to support — so the types
      # belong on 22 even when newer ones exist. Bumping them would let code
      # referencing Node 24+ APIs typecheck clean and still break a consumer
      # on Node 22. Drop this entry when engines moves off >=22.
      #
      # Note: unlike the frontend apps, there is deliberately no `eslint`
      # major ignore here. Their block exists because eslint-plugin-jsx-a11y
      # and eslint-plugin-react cap at eslint ^9; this package depends on
      # neither, so ESLint 10 may well install cleanly and is worth trying.
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'

  # GitHub Actions — pinned action versions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
